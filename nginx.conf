# Custom Nginx config: serves the website as before, but also exposes
# an internal-only /stub_status endpoint that reports basic metrics
# (active connections, total requests, etc.). This isn't Prometheus
# format by itself — the nginx-prometheus-exporter sidecar (added in
# the Helm chart) reads this endpoint and converts it into metrics
# Prometheus can scrape.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only reachable from inside the pod (the exporter sidecar),
    # not exposed externally — this is standard practice since
    # stub_status reveals internal server details.
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
