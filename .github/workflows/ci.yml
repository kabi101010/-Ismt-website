name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------
  # JOB 1: Basic HTML validation
  # For a static site, "tests" mean checking the HTML itself
  # is well-formed, rather than running unit tests.
  # -----------------------------------------------------
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate HTML files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true

  # -----------------------------------------------------
  # JOB 2: Scan code for accidentally committed secrets
  # -----------------------------------------------------
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------
  # JOB 3: Build the Docker image and scan it for
  # known vulnerabilities before it's considered "safe"
  # -----------------------------------------------------
  build-and-scan:
    name: Build & scan Docker image
    runs-on: ubuntu-latest
    needs: [validate-html, secret-scan]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ismt-website:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ismt-website:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
